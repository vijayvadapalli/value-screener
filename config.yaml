# Value Screener configuration. Everything a judgement call lives here, not in the code.

as_of: today                 # date for stale checks and the report name: "today", or a fixed date like 2026-11-04; --asof overrides

spot:                        # USD per oz (gold, silver) or per lb (uranium U3O8, copper, zinc, lead)
  gold: 4131
  silver: 52.86
  uranium: 92.0
  copper: 6.40
  zinc: 1.35
  lead: 0.90

# Metals that move in the "metal price" scenarios. By-products stay at spot.
scenario_metals: [gold, silver, uranium, platinum, palladium]
metal_scenarios: [-0.25, -0.10, 0.0, 0.15, 0.30]
growth_scenarios: [-0.10, 0.0, 0.05, 0.10, 0.15, 0.20, 0.25]

fx_usd_per_unit:             # USD per 1 unit of currency
  USD: 1.0
  CAD: 0.7159                # 3 Nov 2026
  EUR: 1.1170                # 27 Oct 2026
  AUD: 0.7029                # 26 Oct 2026
  TWD: 0.0312695             # 1 / 31.98, TSMC's Q3 average
  KZT: 0.00204082            # 1 / 490, Kazatomprom 2026 guidance rate
  INR: 0.0106346             # 1 / 94.033, Yahoo INR=X close 12 Nov 2026 – only for the market-value shade of Indian stocks
  CNY: 0.150125               # 1 / 6.6611, Yahoo CNY=X close 13 Nov 2026 (Zijin, Chifeng report in yuan)
  HKD: 0.127466               # 1 / 7.8452, Yahoo HKD=X close 13 Nov 2026 (their H shares trade in Hong Kong)
  MXN: 0.053965               # 1 / 18.5305, Yahoo MXN=X close 13 Nov 2026 (Peñoles trades in pesos)
  # GBP is not needed while those companies' inputs and prices share a currency.

multiples:                   # owner-earnings multiples [cautious, fair]
  producer: [12, 15]
  cashflow: [10, 13]
  sell: 25                   # price at or above this multiple of owner earnings = SELL zone
  fair_band: [15, 20]        # shown for reference

growth_dcf:
  discount_rate: 0.10            # US and everything not listed below
  discount_rate_by_currency:     # Playbook: 12% for India (no-growth multiple ≈ 12.1x instead of 13.1x)
    INR: 0.12
  exit_multiple: 15.0
  years: 5

zones:
  buy_margin_of_safety: 0.20     # producers: (value@12x - price) / value@12x
  max_cost_ratio: 0.60           # AISC / spot must be at or below this for BUY
  developer_buy_pnav: 0.80       # price / NAV
  developer_sell_pnav: 1.50
  physical_buy_pnav: 0.85
  physical_sell_pnav: 1.10
  growth_buy: 0.05               # implied growth at or below = BUY
  growth_watch: 0.10
  growth_sell: 0.25
  growth_buy_tier_a: 0.10        # tier A growth stocks are green up to 10% a year
  min_cash_conversion: 0.70      # operating cash ÷ net profit over 5 years; below this the signal is capped at blue

stale_days:                      # days after period end before a file is treated as stale
  default: 100
  developer: 200
  physical: 45
  leases: 100
  liquid: 100
price_stale_days: 7              # a share price older than this gets a [price N days old] flag

# Tiers (Valuation Playbook). A = large low-cost producers and royalty companies with strong balance sheets:
# start a position at or below the 15x value, add at or below 12x. B and C keep the strict rule: BUY only with a 20%
# margin of safety at 12x (or at or below 0.8x NAV). A company file can also set `tier:` itself.
tiers:
  A: [AEM, AGI, CCJ, FNV, NEM, PAAS, RGLD, WPM]
  B: [CDE, FSM, IAG, IVN, IVPAF]
  C: [ABRA, CVVUF, DNN, FRHLF, HUT, MTA, MYRUF, NXE, SRUUF, UEC, UUUU, YCA]

# Shade for growth stocks (tech, Nifty 50) = market value in US$ bn: darkest / medium / light, lightest below.
market_cap_shades_usd_bn: {darkest: 100, medium: 30, light: 10, tech_mega: 200}

stress_gold: [3000, 3500]        # producers: value at 12x if gold falls to these prices (US$/oz)

# Price cases (valuescreen/price_cases.py), shown on the company pages of lists with `price_cases: true` (core): the
# value at 12x / 15x / 25x (NAV for developers and physical holders) at each of these prices, one metal at a time,
# the others at spot. Today's spot is always added as a row. An assumption, not a reported figure.
# US$/oz (gold, silver) or US$/lb (uranium, copper). Silver, uranium and copper are placeholders until chosen.
price_cases:
  gold: [3500, 4000, 5000]
  silver: [40, 50, 65]
  uranium: [70, 90, 120]
  copper: [4.50, 5.50, 7.00]

nifty_v2:                        # per-share rules for Indian companies valued from Screener.in (tools/fetch_screener.py)
  one_off_median_x: 2.0          # a quarter is a one-off if > 2x the median of the other 7 quarters ...
  one_off_neighbour_x: 1.6       # ... and > 1.6x its neighbours; it is replaced by the neighbours' average
  cyclical_industries: [Metals & Mining, Oil Gas & Consumable Fuels, Construction Materials, Power,
                        Automobile and Auto Components, Chemicals, Realty, Textiles]   # the last three: midcaps
  cyclical_tickers: [INDIGO]     # airlines sit under "Services"
  financial_industries: [Financial Services]
  insurers: [HDFCLIFE, SBILIFE, ICICIPRULI, ICICILIFE, ICICIGI, LICI, GICRE, NIACL, STARHEALTH, MFSL]
  conglomerates: [LT, M&M, BAJAJ-AUTO, GRASIM]   # flagged: conglomerates and finance arms

# Bad loans at banks and other lenders (valuescreen/asset_quality.py). Book value is cut by bad loans not yet provided
# for (India: net NPA; US: nonaccrual loans above the allowance). Any of these warning signs flags the company, caps a
# cheap signal at blue and keeps it off the shortlist.
asset_quality:
  max_net_npa: 0.02              # India: net NPA above 2% of loans
  max_gross_npa: 0.05            # India: gross NPA above 5% of loans
  min_coverage: 0.60             # India: provisions below 60% of the bad loans (≈ 1 − net NPA % ÷ gross NPA %)
  max_gross_npa_rise: 0.005      # India: gross NPA up more than 0.5 points over four quarters
  max_nonaccrual: 0.02           # US: nonaccrual loans above 2% of loans (an allowance below them is flagged too)
  max_nco_rise: 0.5              # US: net charge-off rate more than 50% above the twelve months before ...
  min_nco_for_rise: 0.002        # ... and at least 0.2% of loans (so a tiny base doesn't trigger it)

# The growth-at-a-value-price screen (valuescreen/growth_screen.py) for lists with `screen: growth` – the Nifty
# Midcap 150. On top of the valuation: P/E, EPS growth over 5 AND 3 years, and the expected return of a 5-year hold.
growth_screen:
  max_pe: 15                   # price minus net cash ÷ the EPS the valuation uses
  min_eps_cagr: 0.20           # EPS growth a year, over both 5 and 3 years, every year profitable
  years: 5                     # the holding period
  growth_haircut: 0.5          # the 5-year return assumes growth at half the past rate ...
  max_assumed_growth: 0.15     # ... and at most 15% a year
  exit_multiple: 15            # sold at this P/E after the hold
  min_return: 0.12             # shortlist needs at least this a year
  near_max_pe: 20              # near miss: one thing short – a P/E of 15–20 with growth met, ...
  near_min_eps_cagr: 0.15      # ... growth of 15–20% with the P/E met, or only the return bar
  min_cash_conversion: 0.70    # guards: cash conversion, no history break, no bad-loan warning, current results
  state_owned: [BANKINDIA, BDL, BEL, BHEL, COALINDIA, COCHINSHIP, CONCOR, GICRE, HINDCOPPER, HINDPETRO, HUDCO, INDIANB, IOB, IRCTC, IREDA, LICI, MAHABANK, NATIONALUM, NHPC, NLCINDIA, NMDC, NTPC, NTPCGREEN, OIL, ONGC, POWERGRID, RECLTD, RVNL, SAIL, SBIN]
                               # flagged "state-owned": the promoter is the government, so a high promoter holding means
                               # government control, not a founder with skin in the game (hand-kept list)
  min_promoter: 0.60           # flag: promoters hold less than this ...
  promoter_drop: 0.02          # ... or their holding fell more than 2 points over four quarters
  min_roe: 0                   # the quality check (growth_screen.quality) – off here, so the Midcap 150 screen stays
  min_roe_financials: 0        # Dr. Gupta's five rules; a list turns it on in its screen_rules (the Nifty 50)
  max_debt_equity: null        # null: no debt limit
  financials_separate: true    # banks, NBFCs and insurers: their own ROE bar, no debt limit
  default_filters:             # the report's settings panel starts with these, and the page, its answer and the
    prule: true                # backtest use them: promoters at least min_promoter (none known: out),
    psu: false                 # government-owned companies stay in (switch on to leave them out),
    mid: true                  # the list's own names only (not those added by hand with `extra:`),
    cyc: false                 # cyclicals stay in (switch on to leave them out)

# The same screen for the S&P 500 / Nasdaq-100 (tools/screen_us.py), a little more liberal: the US discount rate is
# 10%, so a P/E of 16 already means 5% growth a year. EPS from SEC filings (diluted, split-adjusted).
us_growth_screen:
  max_pe: 18
  min_eps_cagr: 0.15           # over both 5 and 3 years, every year profitable
  years: 5
  growth_haircut: 0.5
  max_assumed_growth: 0.15
  exit_multiple: 15
  min_return: 0.10             # the US discount rate
  near_max_pe: 22
  near_min_eps_cagr: 0.12
  min_cash_conversion: 0.70
  page_years: 20               # price history on the pages of the interesting companies (shortlist, near miss, green)
  backtest: [5, 4, 3, 2]       # the US screen page's backtest: these rules on dates this many years ago (backtest.run_us)

# Buy-zone and review lists (valuescreen/buy_zone.py) for lists with `buy_zone: true` – the core list. Buy zone =
# valuation green, the price near support and the RSI oversold, all three; review = two of the three. The decision log
# is private: data/private/decisions/<list>.yaml (tools/decide.py); entries with `public: true` show in the report.
buy_zone:
  near_support: 0.05           # the price at most 5% above the nearest support (auto on the chart, or a watched level)
  max_rsi: 30                  # 14-day RSI below this

# The resource screen (valuescreen/resource_screen.py) for lists with `screen: resource` – core, oil, miners: the
# growth screen translated for companies whose profit follows a metal or oil price.
resource_screen:
  fair_multiple: 15            # fair value = 15x owner earnings at today's spot (13x cash flow for oil, from the model)
  metal_drop: 0.20             # still at or below fair value with the metal this much lower
  min_volume_growth: 0.05      # revenue growth with the metal-price change taken out, a year, about 3 years
  years: 5                     # the hold: earnings flat at today's spot, sold at fair value
  min_return: 0.10
  max_cost_ratio: 0.60         # AISC ÷ spot, where known

