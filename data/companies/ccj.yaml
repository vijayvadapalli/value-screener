- Yahoo Finance CCO.TO earnings estimates (analyst consensus), 17 Nov 2026 – reference only
assumptions:
- 'Price cases only (headline value unchanged): realised price from Cameco''s table of expected realized price at each spot price, 2028 row (Q3-2026
  MD&A, 30 Sep 2026) - the table is Cameco''s, not a forecast; it covers only contracts finalised at 30 Sep 2026'
- 'Price cases: 28m lb a year sold (average committed deliveries 2026-2030, MD&A p. 24); 3m lb a year bought at spot (2026 outlook: market purchases
  up to 3m lb). JV Inkai purchases (4.2m lb) left out - their higher cost comes back as Cameco''s share of Inkai earnings'
- 'Price cases: royalty 7.7% = royalties / uranium revenue, 9M-2026 (145.4 / 1,888); the Saskatchewan profit royalty makes the rate on extra revenue
  higher, so the upside cases are a little generous. Tax 25% = income tax / earnings before tax, 9M-2026 (65 / 263)'
- 'Check (MD&A p. 23): with the 2026 row, 30m lb sold, spot US$89.50 and 1.35 USDCAD, these inputs give revenue +$10m / -$10m and adjusted net
  earnings -$8m / +$8m for spot +/- US$5/lb; Cameco reports +$6m / -$11m and -$7m / +$4m. Right direction; the fall is overstated (floors and
  inventory accounting are not modelled)'
- 'Owner earnings, 9M-2026 (Q3-2026 MD&A): adjusted net earnings 279 + addbacks 150.5 + D&A 203 − sustaining and capacity-replacement capex 242,
  × 4/3'
- Capex 242 = 9M additions to property, plant and equipment 321.5 × 75% – the sustaining + capacity replacement share of the 2026 plan (387.5
  of 515, 2025 annual MD&A); growth capex left out
- 'Addbacks 150.5 = Westinghouse restated +197, less share-based compensation −46.5. Westinghouse sits in adjusted net earnings at about −59 (IFRS
  net loss −80, mostly amortisation of the purchase price, plus Cameco''s adjustments +21); its owner earnings are adjusted EBITDA 427 − incentive
  plan 50 − other expenses 23 − net finance costs 135 − sustaining capex 81 (9M capex 146 × the 2026 plan''s sustaining share 100 / 180) = 138,
  tax about nil. Share-based compensation 62 (added back in adjusted net earnings) is a real cost: −62 × (1 − 25%)'
- 'Forward 2028: uranium unit cost held at the 2026 guidance (C$67–70/lb, with purchases at about C$110/lb – more if spot stays near US$92); fuel
  services, administration, exploration, R&D, finance costs, Inkai and Westinghouse held at 2026 levels – Cameco gives no 2028 outlook for them.
  28m lb = average committed deliveries 2026–2030'
