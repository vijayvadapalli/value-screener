assumptions:
- River Bend NOI = $7.0bn ÷ 15 years; Beacon Point Phase 1 = company campus NOI $1.3bn − Phase 2 $655m. NOI ≈ rent because the leases are triple-net.
- Phase 1 lease assumed to run to 2042 (bond maturity). Construction-period interest assumed paid from the restricted proceeds, so no equity is
  needed for River Bend or Phase 1, as management says.
- 'Phase 2: $5.0bn cost (85% debt, 15% equity = $750m from Hut 8) is an assumption from the Phase 1 bond size; management has not given cost or
  terms.'
- Tax 21% on NOI less interest and 15-year straight-line depreciation; loss carry-forwards and bonus depreciation would lower it (upside).
- 'American Bitcoin: only its bitcoin is counted, not its mining business or debt. Rest of the business at 3–7x the adjusted EBITDA run-rate.'
notes:
- Price $52.65 is the 6 Nov 2026 close per Morningstar; earlier sources conflict ($48.46 intraday 6 Nov, $45.95 close 5 Nov, $63.75 cited for
  4 Nov).
- 'Tenant quality is the strongest point: a Google backstop at River Bend and an AA- or better tenant at Beacon Point, so the main risk is delivery,
  not payment.'
- 'Watch-list dates: 10 Dec 2026 (audit result for Beacon Point''s Texas baseload classification) and 17 Dec (expected final classification) –
  both gate Phase 2 financing.'
- 'Volatility is extreme (beta above 4): closes moved from about $76 (15 Oct) to $46 (5 Nov). Size any options small.'
- Morningstar's quantitative model (7 Nov) gives $70.74 fair value / 5 stars, but it does not model the leases and reads the restricted construction
  cash as low leverage.
